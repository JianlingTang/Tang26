name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-lint-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Run ruff
        run: >
          uvx ruff check
          --exclude '._*'
          bundled_pipeline src tests scripts

      - name: Run black
        run: >
          uvx black --check
          --exclude '/(\.venv|__pycache__|\.pytest_cache|\._.*)/'
          bundled_pipeline src tests scripts
