[project]
name = "legus-slug-pipeline"
version = "0.1.0"
description = "Packaged layout, defaults, and smoke tests for the LEGUS + cluster_slug + NN completeness pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astropy>=7.2.0",
    "emcee>=3.1.6",
    "joblib>=1.4.0",
    "numexpr>=2.14.1",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "bundled_pipeline"]
